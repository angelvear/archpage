<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<body class="m-0 p-0">
<main class="bg-[#efede6] relative w-full h-screen flex flex-col items-center">

<div class="px-2 md:px-10 py-4 md:py-0 w-screen md:w-full md:fixed z-50">
        <nav class="w-full flex flex-row">
            <p class="text-lg py-2 md:py-10 flex flex-1">
            <a href="./index.html" class="text-orange-500 flex items-center">
            <span class="material-symbols-outlined">
                arrow_back
            </span>
            Volver
            </a>
            </p>
        </nav>   
    </div>

    <div class="px-2 md:px-0">
        <div class="py-10 ">
            <h1 class="uppercase text-2xl">Estudio arquitectura</h1>
            <h3 class="text-gray-500 text-lg">Cuéntanos sobre tu proyecto. Cada conversación comienza con escuchar.</h3>
        </div>

        <form action="#" method="post" class="gap-10">
        
        <div class="flex flex-col gap-8 mt-10">
            <label class="uppercase text-gray-500">Nombre completo</label>
            <input type="text" name="nombre" class="border-b border-gray-600 focus:border-orange-600 focus:outline-none ring-0">
        </div>
        <div class="flex flex-col gap-8 mt-10">
            <label class="uppercase text-gray-500">Email</label>
            <input type="email" name="email" class="border-b border-gray-600 focus:border-orange-600 focus:outline-none ring-0">
        </div>
        <div class="flex flex-col gap-8 mt-10">
            <label class="uppercase text-gray-500">Teléfono</label>
            <input type="number" name="telefono" class="border-b border-gray-600 focus:border-orange-600 focus:outline-none ring-0">
        </div>
        <div class="flex flex-col gap-8 mt-10">
            <label class="uppercase text-gray-500">Cuéntanos tu proyecto</label>
            <textarea name="descrip" rows="4" class="border-b border-gray-600 focus:border-orange-600 focus:outline-none ring-0"></textarea>
        </div>
        
        </form>
    </div>
</main>
